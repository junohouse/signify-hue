[driver]
id = "signify.hue.bridge"
name = "Philips Hue Bridge"
manufacturer = "Signify"
# The maker's mark, linked and never copied — this package ships no Philips Hue artwork. Core
# dereferences it once for the whole house (`GET /artwork?driver=<id>`) and every screen
# draws the same picture: the phone, the on-screen display and the wall panel.
icon = "https://www.philips-hue.com/etc.clientlibs/signify-brand-hue/clientlibs/clientlib-main-v2/resources/favicons/favicon_192px.png"
version = "1.4.0"
# Nobody buys a bridge. The package is Philips Hue, and what it is for is light — a bridge is
# how the light is reached, not what is on the shelf. Without these two the catalog led with
# `Philips Hue Bridge` under a router, filed beside Z-Wave sticks.
product = "Philips Hue"
kind = "light"
runtime = "wasm"
# What this driver is worth hearing when nothing is wrong. Declaring it is also what lets an
# installer change it from the Logs page; a driver that declares nothing sits at `info` with
# no control. Everything it prints rather than logs is taken as `debug` and held to this too.
log_level = "info"
# Core may ask the bridge to replace per-bulb fan-out with one Hue grouped_light request.
group_control = true
scene_control = true

# The bridge is a device in its own right. It holds the address and the paired key once, and
# every bulb behind it reads them from here — so a bridge that moves to a new IP is edited in
# one place rather than six.
[[proxy]]
id = 1
type = "bridge"
primary = true
name = "Bridge"
capabilities = { child_driver = "signify.hue.bulb" }

[[control]]
id = 1
kind = "network"
name = "Hue API"
port = 443
# Held open, and wrapped in TLS. The bridge presents a self-signed certificate, and it is
# trusted on the strength of the application key it issued us rather than a public CA.
keepalive = true
tls = true

[[property]]
name = "Bridge address"
type = "string"
tooltip = "IP or hostname of the Hue bridge"

[[property]]
name = "Application key"
type = "password"
tooltip = "Issued by the bridge when its link button is pressed"

[discovery]
mdns = ["_hue._tcp"]
mac_oui = ["00:17:88", "EC:B5:FA"]
