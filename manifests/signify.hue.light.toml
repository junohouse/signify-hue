[driver]
id = "signify.hue.light"
name = "Philips Hue Light"
manufacturer = "Signify"
# The maker's mark, linked and never copied — this package ships no Philips Hue artwork. Core
# dereferences it once for the whole house (`GET /artwork?driver=<id>`) and every screen
# draws the same picture: the phone, the on-screen display and the wall panel.
icon = "https://www.philips-hue.com/etc.clientlibs/signify-brand-hue/clientlibs/clientlib-main-v2/resources/favicons/favicon_192px.png"
version = "1.4.0"
runtime = "wasm"
# What this driver is worth hearing when nothing is wrong. Declaring it is also what lets an
# installer change it from the Logs page; a driver that declares nothing sits at `info` with
# no control. Everything it prints rather than logs is taken as `debug` and held to this too.
log_level = "info"
# Lights live behind a bridge and inherit its address and key.
parent = "signify.hue.bridge"

# One driver, because Philips sells one thing called a light. What any given fitting can do —
# color, white balance, dimming, and the range its whites span — is answered per light by the
# bridge during setup and lands on the device as `Candidate::capabilities`. What is declared
# here is only what is true of all of them.
#
# There were five of these: bulb, bulb.color, bulb.dimmable, bulb.tunable, bulb.on_off. They
# differed in one capability line each and were five separate things to install.
[[proxy]]
id = 1
type = "light"
primary = true
capabilities = { min_on_level = 1 }

[[property]]
name = "Light id"
type = "string"
tooltip = "The light's resource id on the bridge"
