[driver]
id = "signify.hue.wall_switch"
name = "Philips Hue Wall Switch Module"
manufacturer = "Signify"
version = "1.4.0"
runtime = "wasm"
# What this driver is worth hearing when nothing is wrong. Declaring it is also what lets an
# installer change it from the Logs page; a driver that declares nothing sits at `info` with
# no control. Everything it prints rather than logs is taken as `debug` and held to this too.
log_level = "info"
parent = "signify.hue.bridge"

# The module that sits behind an existing rocker or toggle and turns it into something the bridge
# hears. Two bindings, because that is what the hardware reports in its two-rocker mode.
#
# In single-rocker mode the bridge publishes one button service and the second binding never fires.
# It is left declared rather than split into a separate one-button driver: the module can be
# switched between modes in the Hue app without being re-paired, and a device that changed shape on
# a setting would have to be removed and re-added to follow it.
#
# Note what this is not. The module reports presses; it does not switch the load — the load stays
# wired to whatever it was always wired to, and Hue's own bulbs behind it stay permanently powered.
# So this is a `button`, not a `switch`, and there is nothing here to turn on.

# One binding for the whole remote, with the keys as parameters.
#
# A rule matches `pressed { key = 2, action = "held" }`, so "when the hall dimmer's brighter key
# is held" is expressible on one binding — which it was not before core's triggers could match
# parameters, and which is why this contract used to be one binding per key. A remote is one
# object somebody picks up; four bindings made it four tiles and four things to go offline
# separately.

[[proxy]]
id = 1
type = "keypad"
primary = true
capabilities = { key_count = 2, key_labels = "Left,Right", has_hold = true, has_repeat = true, has_double = true, has_triple = true, has_battery = true }

[[property]]
name = "Button 1 id"
type = "string"
tooltip = "Resource id of the first button"

[[property]]
name = "Button 2 id"
type = "string"
tooltip = "Resource id of the second button, if the module is in two-rocker mode"

[[property]]
name = "Power id"
type = "string"
tooltip = "The battery service's resource id on the bridge"
