[driver]
id = "signify.hue.dimmer"
name = "Philips Hue Dimmer Switch"
manufacturer = "Signify"
# The maker's mark, linked and never copied — this package ships no Philips Hue artwork. Core
# dereferences it once for the whole house (`GET /artwork?driver=<id>`) and every screen
# draws the same picture: the phone, the on-screen display and the wall panel.
icon = "https://www.philips-hue.com/etc.clientlibs/signify-brand-hue/clientlibs/clientlib-main-v2/resources/favicons/favicon_192px.png"
version = "1.4.0"
runtime = "wasm"
# What this driver is worth hearing when nothing is wrong. Declaring it is also what lets an
# installer change it from the Logs page; a driver that declares nothing sits at `info` with
# no control. Everything it prints rather than logs is taken as `debug` and held to this too.
log_level = "info"
parent = "signify.hue.bridge"


# One binding for the whole remote, with the keys as parameters.
#
# A rule matches `pressed { key = 2, action = "held" }`, so "when the hall dimmer's brighter key
# is held" is expressible on one binding — which it was not before core's triggers could match
# parameters, and which is why this contract used to be one binding per key. A remote is one
# object somebody picks up; four bindings made it four tiles and four things to go offline
# separately.

[[proxy]]
id = 1
type = "keypad"
primary = true
capabilities = { key_count = 4, key_labels = "On,Brighter,Dimmer,Off", has_hold = true, has_repeat = true, has_double = true, has_triple = true, has_battery = true }

[[property]]
name = "Button 1 id"
type = "string"
tooltip = "Resource id of the first button"

[[property]]
name = "Button 2 id"
type = "string"
tooltip = "Resource id of the second button"

[[property]]
name = "Button 3 id"
type = "string"
tooltip = "Resource id of the third button"

[[property]]
name = "Button 4 id"
type = "string"
tooltip = "Resource id of the fourth button"

[[property]]
name = "Power id"
type = "string"
tooltip = "The battery service's resource id on the bridge"
